<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>csvigevano</title>
    <link rel="stylesheet" href="stylesvigevano.css">
</head>
<body>
    <a href="wip.html" class="floating-button" style="position: fixed; left: 20px; top: 0px;"></a>
      <header>
      <img src="risorse/vigevano/icons/login_12121599.png" style="height: 50px; width: 50px;">
      <div class="header-text">
          <div class="form-group">
          <label for="generation">Generazione:</label>
          <select id="generation" name="generation">
            <option value="">-</option>
            <option value="14">14</option>
            <option value="13">13</option>
            <option value="12">12</option>
            <option value="11">11</option>
            <option value="10">10</option>
            <option value="9">9</option>
            <option value="8">8</option>
          </select>
        </div>
        <div class="form-group">
          <label for="clan">Clan:</label>
          <select id="clan" name="clan">
            <option value="">-</option>
            <option value="brujah">Brujah</option>
            <option value="gangrel">Gangrel</option>
            <option value="malkavian">Malkavian</option>
            <option value="nosferatu">Nosferatu</option>
            <option value="toreador">Toreador</option>
            <option value="tremere">Tremere</option>
            <option value="ventrue">Ventrue</option>
            <option value="assamiti">Assamiti</option>
            <option value="giovanni">Giovanni</option>
            <option value="lasombra">Lasombra</option>
            <option value="ravnos">Ravnos</option>
            <option value="setite">Setite</option>
            <option value="tzimisce">Tzimisce</option>
            <option value="vili">Vili</option>
          </select>
        </div>
      </div>

      <div class="stat-group">
        <img src="risorse/vigevano/icons/mask_4061302.png" style="height: 20px; width: 20px; position: relative; top: 0px;" title="Maquerade">
        <button type="button" onclick="change(this, 1)">+</button>
        <input type="number" min="0" max="15" step="1" value="1">
        <button type="button" onclick="change(this, -1)">-</button>
      </div>

      <div class="stat-group">
      <img src="risorse/vigevano/icons/drop_1633486.png" style="height: 20px; width: 20px; position: relative; top: 0px;" title="Blood">
        <button type="button" onclick="change(this, 1)">+</button>
        <input type="number" min="0" max="15" step="1" value="1">
        <button type="button" onclick="change(this, -1)">-</button>
            </div>
        
      <div class="stat-group"> 
        <img src="risorse/vigevano/icons/love_7238141.png" style="height: 20px; width: 20px; position: relative; top: 0px;" title="Humanity">
            <button type="button" onclick="change(this, 1)">+</button>
            <input type="number" min="0" max="15" step="1" value="1">
            <button type="button" onclick="change(this, -1)">-</button>
            </div>

      <div class="stat-group">
        <img src="risorse/vigevano/icons/insurance_5609318.png" style="height: 20px; width: 20px; position: relative; top: 0px;" title="Health">
            <button type="button" onclick="change(this, 1)">+</button>
            <input type="number" min="0" max="15" step="1" value="1">
            <button type="button" onclick="change(this, -1)">-</button>
            </div>

    <script>
  function change(button, delta) {
    const stat = button.closest('.stat-group');
    const input = stat.querySelector('input[type="number"]');
    const min = Number(input.min) || -Infinity;
    const max = Number(input.max) || Infinity;
    const next = Number(input.value) + delta;
    input.value = Math.min(max, Math.max(min, next));
    input.dispatchEvent(new Event('input'));
  }
  </script>
          
    </header>
    <nav>
    <button onclick="setLayout(1)" style="position: absolute; margin-left: 0%;">Discipline</button>
    <button onclick="setLayout(2)" style="position: absolute; margin-left: 50%;">Abilità</button>
    <button onclick="setLayout(3)" style="position: absolute; margin-left: 100%;">Background</button>
  </nav>

  <div class="layout" id="layout1">
    <h1>Discipline</h1>
    <p>Content for layout 1</p>
  </div>

  <div class="layout" id="layout2">
    <h1>Abilità</h1>
    <p>Content for layout 2</p>
  </div>

  <div class="layout" id="layout3">
    <h1>Background</h1>
    <p>Content for layout 3</p>
  </div>

  <script>
    function setLayout(n) {
      document.body.dataset.layout = 'layout' + n;
    }
    setLayout(1);
  </script>
</body>
