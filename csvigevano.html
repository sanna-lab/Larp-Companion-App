      <header>
      <img src="risorse/vigevano/icons/login_12121599.png" style="height: 50px; width: 50px;">
      <div class="header-text">
          <div class="form-group">
          <label for="generation">Generazione:</label>
          <select id="generation" name="generation">
            <option value="">-</option>
            <option value="14">14</option>
            <option value="13">13</option>

      <div class="stat">
      <img src="risorse/vigevano/icons/mask_4061302.png" style="height: 20px; width: 20px; position: relative; top: 0px;">
            <button type="button" onclick="change(-1)">-</button>
            <input type="number" id="qty" min="0" max="10" step="1" value="1">
            <button type="button" onclick="change(1)">+</button>
            
            <script>
            function change(delta) {
              const el = document.getElementById('qty');
              const min = Number(el.min) || -Infinity;
              const max = Number(el.max) || Infinity;
              const next = Number(el.value) + delta;
              el.value = Math.min(max, Math.max(min, next));
              el.dispatchEvent(new Event('input'));
            }
            </script> 
            </div>
